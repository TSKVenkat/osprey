<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="openloom">
  <!--
    A shutter left open, with a play triangle inside it.

    The gap in the ring is the whole idea: closed, this is the play button every
    other product uses. It is a quarter-turn wide and the stroke is heavy because
    the mark has to survive being drawn at sixteen pixels in a browser tab, where a
    thin gap simply fills in. A woven thread — the more literal reading of "loom" —
    does not survive that at all.
  -->
  <defs>
    <linearGradient id="openloom-mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6" />
      <stop offset="1" stop-color="#1d4ed8" />
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="8.5" fill="url(#openloom-mark)" />
  <path
    d="M25.61 14.65A9.7 9.7 0 1 1 17.35 6.39"
    fill="none"
    stroke="#ffffff"
    stroke-opacity="0.5"
    stroke-width="2.9"
    stroke-linecap="round"
  />
  <path d="M13.6 11.5 21.3 16l-7.7 4.5z" fill="#ffffff" />
</svg>
