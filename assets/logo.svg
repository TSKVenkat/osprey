<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="bilby">
  <!--
    Two ears and a play button.

    A bilby is mostly ears, which is the one part of the animal that still reads at
    sixteen pixels in a browser tab — a snout or an eye does not. The face is the
    play triangle cut out of the head rather than drawn on top of it, so the mark
    stays two shapes and one colour at every size.
  -->
  <defs>
    <linearGradient id="bilby-mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f8bf5" />
      <stop offset="1" stop-color="#2250c8" />
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="8.5" fill="url(#bilby-mark)" />
  <g fill="#ffffff">
    <ellipse cx="11.1" cy="10.4" rx="3.05" ry="5.5" transform="rotate(-13 11.1 10.4)" />
    <ellipse cx="20.9" cy="10.4" rx="3.05" ry="5.5" transform="rotate(13 20.9 10.4)" />
    <circle cx="16" cy="20.2" r="7.4" />
  </g>
  <path d="M13.7 16.6 20.4 20.2l-6.7 3.6z" fill="#2250c8" />
</svg>
