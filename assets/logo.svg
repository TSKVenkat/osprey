<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="osprey">
  <!--
    A wing that is also a play button.

    Drawing the bird itself was tried first and does not work: at sixteen pixels in
    a browser tab a raptor's head reads as a fish and a raptor in flight reads as a
    crown. What survives that size is the triangle, which everyone already knows
    means play — so the mark is a play button whose trailing edge is feathered, and
    the bird only appears once it is large enough to show.
  -->
  <defs>
    <linearGradient id="osprey-mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f8bf5" />
      <stop offset="1" stop-color="#2250c8" />
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="8.5" fill="url(#osprey-mark)" />
  <path
    d="M11.2 7.4 25 16 11.2 24.6c1.1-2 1.6-4.1 1.6-6.3-1.6.5-2.4.4-3.4-.2 1.4-.7 2.2-1.5 2.6-2.6-1.6.3-2.5 0-3.3-.7 1.5-.4 2.4-1 3-2-1.4-.2-2.1-.7-2.6-1.6 1.2 0 2.1-.2 2.9-.7-.2-.9.1-1.9 1.2-2.5z"
    fill="#ffffff"
  />
</svg>
