name: Feature request
description: Something the software should do and does not.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The situation, not the solution. What did you want, and what
        did you have to do instead?
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What you have in mind
      description: If you have a shape in mind, describe it. If not, that is fine
        — the problem is the useful half.

  - type: textarea
    id: alternatives
    attributes:
      label: What you tried already
      description: Including workarounds. A workaround that almost works often
        says more about the right design than the request does.
