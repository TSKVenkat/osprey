name: Bug report
description: Something does not work the way it says it does.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        For a security problem, do not file this. See
        [SECURITY.md](https://github.com/TSKVenkat/osprey/blob/main/SECURITY.md).

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what happened, and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: How to reproduce it
      description: The shortest sequence that shows the problem.
      placeholder: |
        1. Sign in
        2. Record for about ten seconds
        3. …
    validations:
      required: true

  - type: dropdown
    id: storage
    attributes:
      label: Storage backend
      description: Which one the recording was going to. Most bugs that involve
        uploads are specific to one.
      options: [Local disk, S3 or compatible, MinIO, Cloudinary, ImageKit, Not relevant]
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser
      description: Name and version. Screen capture differs enough between them
        that this is usually the first question.
      placeholder: Chrome 141 on Linux
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: main at 1f45eab
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Anything in the logs
      description: |
        `docker compose -f deploy/docker-compose.yml logs api worker`, and the
        browser console if the problem is in the recorder. Errors are logged with a
        request id, which is the fastest way to find the rest of the story.
      render: text
