name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # The processing tests run a real encoder rather than mocking one.
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # The client is built in CI so a broken production build cannot merge.
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: osprey
          POSTGRES_PASSWORD: osprey
          POSTGRES_DB: osprey
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U osprey"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://osprey:osprey@localhost:5432/osprey
      # Fixed key: this database exists for the length of one job.
      SECRET_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: local-admin-password
      PUBLIC_API_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate

      - name: Start the API
        run: |
          node apps/api/src/server.ts &
          npx wait-on http://localhost:3000/ready --timeout 60000

      - name: Start the web client
        run: |
          pnpm --filter @osprey/web dev &
          npx wait-on http://localhost:5173 --timeout 60000

      # Chrome is already on the runner, and the config uses it rather than a
      # downloaded build so capture behaves like the real thing.
      - run: pnpm test:e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-trace
          path: test-results/
          retention-days: 7
