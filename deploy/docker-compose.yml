name: openloom

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: openloom
      POSTGRES_PASSWORD: openloom
      POSTGRES_DB: openloom
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openloom"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: openloom
      MINIO_ROOT_PASSWORD: openloom123
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Creates the bucket and allows browser uploads. Runs once and exits.
  minio-setup:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 openloom openloom123 &&
      mc mb --ignore-existing local/openloom &&
      mc anonymous set none local/openloom &&
      echo 'bucket ready'
      "

volumes:
  postgres-data:
  minio-data:
